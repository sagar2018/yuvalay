<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volunteer — Yuvalay</title><script src="https://cdn.tailwindcss.com?plugins=forms"></script><script src="shared/tailwind-config.js"></script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined"><link rel="stylesheet" href="shared/styles.css"></head><body data-page="volunteer" class="bg-background text-on-surface"><div data-public-nav></div><main class="mx-auto max-w-5xl px-5 py-20"><div class="rounded-[32px] bg-tertiary p-10 text-white md:p-16"><span class="text-sm font-bold">GIVE WHAT YOU KNOW</span><h1 class="mt-4 text-4xl font-bold md:text-5xl">Bring your energy to a young person’s journey.</h1><p class="mt-5 max-w-xl text-lg text-white/80">Lead a session, host a circle, help at an event or simply be someone who listens.</p></div><div class="mt-10 rounded-[28px] bg-white p-8 shadow-soft"><h2 class="text-2xl font-bold">Volunteer interest form</h2><form id="volunteer-form" class="mt-6 grid gap-4 md:grid-cols-2"><input required placeholder="Your name" class="rounded-xl border-outline-variant"><input required type="email" placeholder="Email" class="rounded-xl border-outline-variant"><select class="rounded-xl border-outline-variant"><option>I’d like to mentor</option><option>I’d like to support events</option><option>I’d like to facilitate</option></select><button class="rounded-full bg-primary px-6 py-3 font-semibold text-white">Send interest</button></form><p id="thanks" class="mt-4 hidden text-sm text-tertiary">Thank you — we’ll be in touch soon.</p></div></main><div data-footer></div><script src="shared/nav.js"></script><script>document.querySelector('#volunteer-form').onsubmit=e=>{e.preventDefault();document.querySelector('#thanks').classList.remove('hidden')}</script></body></html>
