<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yuvalay Admin</title><script src="https://cdn.tailwindcss.com?plugins=forms"></script><script src="../shared/tailwind-config.js"></script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined"><link rel="stylesheet" href="../shared/styles.css"></head><body class="grid min-h-screen place-items-center bg-primary-fixed p-5"><main class="w-full max-w-md rounded-[32px] bg-white p-9 shadow-soft"><a href="../index.html" class="text-2xl font-bold text-primary">Yuvalay</a><p class="mt-1 text-sm text-on-surface-variant">Administration portal</p><h1 class="mt-10 text-3xl font-bold">Welcome back</h1><p class="mt-2 text-on-surface-variant">Sign in to manage your community.</p><form id="login" class="mt-7 grid gap-4"><input name="username" required placeholder="Username" class="rounded-xl border-outline-variant"><input name="password" type="password" required placeholder="Password" class="rounded-xl border-outline-variant"><button class="rounded-full bg-primary py-3 font-semibold text-white">Sign in</button><p id="error" class="hidden text-sm text-error">Incorrect credentials. Please try again.</p></form><p class="mt-8 text-xs text-on-surface-variant">Demo credentials: admin / yuvalay2024</p></main><script>if(localStorage.getItem('yuvalayAdmin'))location.href='dashboard.html';document.querySelector('#login').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(f.get('username')==='admin'&&f.get('password')==='yuvalay2024'){localStorage.setItem('yuvalayAdmin','1');location.href='dashboard.html'}else document.querySelector('#error').classList.remove('hidden')}</script></body></html>
