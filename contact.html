<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Yuvalay</title><script src="https://cdn.tailwindcss.com?plugins=forms"></script><script src="shared/tailwind-config.js"></script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined"><link rel="stylesheet" href="shared/styles.css"></head><body data-page="contact" class="bg-background text-on-surface"><div data-public-nav></div><main class="mx-auto grid max-w-7xl gap-10 px-5 py-20 md:grid-cols-2"><div><span class="text-sm font-bold text-primary">JOIN THE MOVEMENT</span><h1 class="mt-4 text-4xl font-bold md:text-5xl">Your next chapter starts with hello.</h1><p class="mt-5 max-w-md text-lg text-on-surface-variant">Whether you’re a young person, mentor, partner or supporter, there’s room for you at Yuvalay.</p><div class="mt-10 rounded-[28px] bg-tertiary p-7 text-white"><b>Have a question?</b><p class="mt-3 text-sm text-white/75">hello@yuvalay.org<br>+91 80 4567 8900</p></div></div><form id="contact-form" class="rounded-[32px] bg-white p-8 shadow-soft"><h2 class="text-2xl font-bold">Tell us a little about you</h2><div class="mt-6 grid gap-4"><input required name="name" placeholder="Your name" class="rounded-xl border-outline-variant"><input required name="email" type="email" placeholder="Email address" class="rounded-xl border-outline-variant"><select name="interest" class="rounded-xl border-outline-variant"><option>I'd like to join as a young person</option><option>I'd like to mentor</option><option>I'd like to partner</option></select><textarea name="message" placeholder="What would you like to explore?" class="min-h-28 rounded-xl border-outline-variant"></textarea><button class="rounded-full bg-primary px-6 py-3 font-semibold text-white">Send message</button></div><p id="sent" class="mt-4 hidden text-sm text-tertiary">Thanks! Your message is safely with our team.</p></form></main><div data-footer></div><script src="shared/nav.js"></script><script>document.querySelector('#contact-form').onsubmit=e=>{e.preventDefault();let d=JSON.parse(localStorage.getItem('yuvalayData')||'{"enquiries":[]}');d.enquiries=d.enquiries||[];let f=new FormData(e.target);d.enquiries.unshift({id:Date.now(),title:f.get('name'),name:f.get('interest'),status:'New'});localStorage.setItem('yuvalayData',JSON.stringify(d));document.querySelector('#sent').classList.remove('hidden');e.target.reset()}</script></body></html>
